<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | QUIZCORE</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-page {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .admin-box {
            background: #090909;
            border: 1px solid #00f6ff;
            border-radius: 15px;
            padding: 35px;
            box-shadow:
                0 0 25px rgba(0,246,255,.25),
                inset 0 0 20px rgba(0,246,255,.04);
        }

        .admin-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-title h1 {
            color: #00f6ff;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .admin-title p {
            color: #888;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #00f6ff;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            background: #050505;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #00f6ff;
            box-shadow: 0 0 10px rgba(0,246,255,.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #00f6ff;
            border: 1px solid #00f6ff;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .login-btn:hover {
            background: #00f6ff;
            color: #000;
            box-shadow: 0 0 20px #00f6ff;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
        }

        .back-home:hover {
            color: #00f6ff;
        }

    </style>
</head>


<body>

<div class="admin-page">

    <div class="admin-box">

        <div class="admin-title">

            <h1>QUIZCORE</h1>

            <p>ADMIN LOGIN</p>

        </div>


        <form id="adminLoginForm">

            <div class="form-group">

                <label for="adminUsername">
                    Admin Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Admin Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">

                ADMIN LOGIN

            </button>


            <div
                id="message"
                class="message">
            </div>

        </form>


        <a
            href="index.html"
            class="back-home">

            ← Back to Home

        </a>

    </div>

</div>


<script>

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const username =
            document
            .getElementById("adminUsername")
            .value
            .trim();


        const password =
            document
            .getElementById("adminPassword")
            .value;


        const message =
            document.getElementById("message");


        /*
            Temporary demo credentials.

            Production version me admin login
            Node.js + MySQL backend se verify hoga.
        */

        if (
            username === "admin" &&
            password === "admin123"
        ) {

            localStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            message.style.color =
                "#00ff88";

            message.textContent =
                "Admin login successful!";


            setTimeout(function() {

                window.location.href =
                    "admin-dashboard.html";

            }, 800);


        } else {

            message.style.color =
                "#ff4d4d";

            message.textContent =
                "Invalid admin username or password.";

        }

    });

</script>

</body>

</html>
