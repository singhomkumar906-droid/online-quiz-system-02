<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question Management | QUIZCORE</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(0,246,255,.12),
                    transparent 30%
                ),
                #030606;
            color: white;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;

            background: #050909;
            border-right: 1px solid #00f6ff;

            box-shadow:
                0 0 20px rgba(0,246,255,.15);

            padding: 25px 15px;
            z-index: 100;
        }

        .logo {
            text-align: center;
            color: #00f6ff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;

            text-shadow: 0 0 10px #00f6ff;

            margin-bottom: 40px;
        }

        .admin-label {
            text-align: center;
            color: #777;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu a {
            text-decoration: none;
            color: #aaa;

            padding: 13px 15px;

            border: 1px solid transparent;
            border-radius: 7px;

            transition: .3s;
        }

        .menu a:hover,
        .menu a.active {
            color: #00f6ff;
            border-color: #00f6ff;
            background: rgba(0,246,255,.06);

            box-shadow:
                0 0 12px rgba(0,246,255,.2);
        }

        .logout {
            margin-top: 40px;
            width: 100%;
            padding: 12px;

            background: transparent;

            border: 1px solid #ff4d4d;
            color: #ff4d4d;

            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout:hover {
            background: #ff4d4d;
            color: #000;

            box-shadow:
                0 0 15px #ff4d4d;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);

            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
            padding-bottom: 20px;

            border-bottom: 1px solid #172525;
        }

        .topbar h1 {
            margin: 0;

            color: #00f6ff;
            font-size: 28px;

            text-shadow:
                0 0 10px rgba(0,246,255,.5);
        }

        .topbar p {
            margin: 6px 0 0;
            color: #777;
        }

        .admin-name {
            padding: 10px 16px;

            border: 1px solid #00f6ff;
            color: #00f6ff;

            border-radius: 7px;
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
            margin-bottom: 20px;
        }

        .quiz-select {
            flex: 1;
            max-width: 500px;
        }

        .quiz-select select {
            width: 100%;

            padding: 13px 15px;

            background: #080d0d;

            border: 1px solid #263333;
            border-radius: 8px;

            color: white;

            outline: none;
        }

        .quiz-select select:focus {
            border-color: #00f6ff;

            box-shadow:
                0 0 12px rgba(0,246,255,.2);
        }

        .add-btn {
            padding: 13px 20px;

            border: 1px solid #00f6ff;
            background: transparent;

            color: #00f6ff;

            border-radius: 8px;
            cursor: pointer;

            font-weight: bold;
        }

        .add-btn:hover {
            background: #00f6ff;
            color: #000;

            box-shadow:
                0 0 15px #00f6ff;
        }

        /* INFO */

        .info-box {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .info-card {
            background: #080d0d;

            border: 1px solid #172525;

            border-radius: 10px;

            padding: 18px;
        }

        .info-card h3 {
            margin: 0 0 8px;

            color: #777;
            font-size: 13px;
        }

        .info-card p {
            margin: 0;

            color: #00f6ff;
            font-size: 25px;
            font-weight: bold;
        }

        /* TABLE */

        .table-container {
            overflow-x: auto;

            background: #080d0d;

            border: 1px solid #172525;

            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 1100px;

            border-collapse: collapse;
        }

        th {
            background: #0c1717;

            color: #00f6ff;

            padding: 15px;

            text-align: left;

            font-size: 13px;
        }

        td {
            padding: 14px 15px;

            border-top: 1px solid #172020;

            color: #ccc;

            font-size: 14px;
        }

        tr:hover td {
            background:
                rgba(0,246,255,.03);
        }

        /* DIFFICULTY */

        .easy {
            color: #00ff88;
            font-weight: bold;
        }

        .medium {
            color: #ffaa00;
            font-weight: bold;
        }

        .hard {
            color: #ff4d4d;
            font-weight: bold;
        }

        /* ACTION */

        .action-btn {
            padding: 7px 11px;

            margin-right: 5px;

            background: transparent;

            border-radius: 5px;

            cursor: pointer;
            font-size: 12px;
        }

        .edit-btn {
            border: 1px solid #00f6ff;
            color: #00f6ff;
        }

        .edit-btn:hover {
            background: #00f6ff;
            color: #000;
        }

        .delete-btn {
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }

        .delete-btn:hover {
            background: #ff4d4d;
            color: #000;
        }

        /* MODAL */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.82);

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 500;
        }

        .modal-box {
            width: 100%;
            max-width: 700px;

            max-height: 90vh;

            overflow-y: auto;

            background: #080d0d;

            border: 1px solid #00f6ff;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 0 30px
                rgba(0,246,255,.3);
        }

        .modal-title {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .modal-title h2 {
            margin: 0;

            color: #00f6ff;
        }

        .close {
            background: transparent;

            border: none;

            color: #ff4d4d;

            font-size: 25px;

            cursor: pointer;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;

            padding: 12px;

            background: #050909;

            border: 1px solid #263333;

            border-radius: 7px;

            color: white;

            outline: none;

            font-family: Arial, sans-serif;
        }

        .form-group textarea {
            min-height: 100px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #00f6ff;
        }

        .options-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }

        .form-actions {
            display: flex;

            gap: 12px;

            margin-top: 25px;
        }

        .save-btn,
        .cancel-btn {
            flex: 1;

            padding: 13px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .save-btn {
            background: #00f6ff;

            border: 1px solid #00f6ff;

            color: #000;
        }

        .cancel-btn {
            background: transparent;

            border: 1px solid #ff4d4d;

            color: #ff4d4d;
        }

        .empty {
            text-align: center;

            padding: 40px;

            color: #666;
        }

        /* MOBILE */

        @media(max-width:900px) {

            .info-box {
                grid-template-columns:
                    repeat(2,1fr);
            }
        }

        @media(max-width:800px) {

            .sidebar {
                width: 100%;

                min-height: auto;

                position: relative;

                border-right: none;

                border-bottom: 1px solid #00f6ff;
            }

            .dashboard {
                display: block;
            }

            .main {
                margin-left: 0;

                width: 100%;

                padding: 20px 15px;
            }

            .menu {
                display: grid;

                grid-template-columns:
                    repeat(2,1fr);
            }

            .logout {
                margin-top: 15px;
            }

            .topbar {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .toolbar {
                flex-direction: column;

                align-items: stretch;
            }

            .quiz-select {
                max-width: none;
            }
        }

        @media(max-width:500px) {

            .info-box {
                grid-template-columns: 1fr;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            QUIZCORE
        </div>

        <div class="admin-label">
            ADMIN PANEL
        </div>

        <nav class="menu">

            <a href="admin-dashboard.html">
                🏠 Dashboard
            </a>

            <a href="admin-students.html">
                👨‍🎓 Students
            </a>

            <a href="admin-quizzes.html">
                📝 Quizzes
            </a>

            <a href="admin-questions.html"
               class="active">
                ❓ Questions
            </a>

            <a href="admin-results.html">
                📊 Results
            </a>

            <a href="admin-schedule.html">
                📅 Schedule
            </a>

        </nav>

        <button
            class="logout"
            onclick="logout()">

            LOGOUT

        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div>

                <h1>
                    QUESTION MANAGEMENT
                </h1>

                <p>
                    Add and manage quiz questions
                </p>

            </div>

            <div class="admin-name">
                👤 ADMIN
            </div>

        </div>


        <!-- TOOLBAR -->

        <div class="toolbar">

            <div class="quiz-select">

                <select
                    id="quizSelect"
                    onchange="loadQuestions()">

                    <option value="">
                        Select Quiz
                    </option>

                </select>

            </div>

            <button
                class="add-btn"
                onclick="openQuestionModal()">

                + ADD QUESTION

            </button>

        </div>


        <!-- INFO -->

        <div class="info-box">

            <div class="info-card">

                <h3>
                    TOTAL QUESTIONS
                </h3>

                <p id="totalCount">
                    0
                </p>

            </div>

            <div class="info-card">

                <h3>
                    EASY
                </h3>

                <p id="easyCount">
                    0
                </p>

            </div>

            <div class="info-card">

                <h3>
                    MEDIUM
                </h3>

                <p id="mediumCount">
                    0
                </p>

            </div>

            <div class="info-card">

                <h3>
                    HARD
                </h3>

                <p id="hardCount">
                    0
                </p>

            </div>

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>QUESTION</th>

                        <th>OPTION A</th>

                        <th>OPTION B</th>

                        <th>OPTION C</th>

                        <th>OPTION D</th>

                        <th>CORRECT</th>

                        <th>DIFFICULTY</th>

                        <th>ACTION</th>

                    </tr>

                </thead>

                <tbody id="questionTable">

                </tbody>

            </table>

        </div>

    </main>

</div>


<!-- QUESTION MODAL -->

<div
    class="modal"
    id="questionModal">

    <div class="modal-box">

        <div class="modal-title">

            <h2 id="modalHeading">
                ADD QUESTION
            </h2>

            <button
                class="close"
                onclick="closeQuestionModal()">

                ×

            </button>

        </div>


        <form id="questionForm">

            <input
                type="hidden"
                id="editIndex"
                value="-1">


            <div class="form-group">

                <label>
                    SELECT QUIZ
                </label>

                <select
                    id="formQuiz"
                    required>

                    <option value="">
                        Select Quiz
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    QUESTION
                </label>

                <textarea
                    id="questionText"
                    placeholder="Enter your question..."
                    required></textarea>

            </div>


            <div class="options-grid">

                <div class="form-group">

                    <label>
                        OPTION A
                    </label>

                    <input
                        type="text"
                        id="optionA"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        OPTION B
                    </label>

                    <input
                        type="text"
                        id="optionB"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        OPTION C
                    </label>

                    <input
                        type="text"
                        id="optionC"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        OPTION D
                    </label>

                    <input
                        type="text"
                        id="optionD"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label>
                    CORRECT ANSWER
                </label>

                <select
                    id="correctAnswer"
                    required>

                    <option value="">
                        Select Correct Answer
                    </option>

                    <option value="A">
                        Option A
                    </option>

                    <option value="B">
                        Option B
                    </option>

                    <option value="C">
                        Option C
                    </option>

                    <option value="D">
                        Option D
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    DIFFICULTY
                    <small style="color:#777;">
                        (Admin only)
                    </small>
                </label>

                <select
                    id="difficulty"
                    required>

                    <option value="">
                        Select Difficulty
                    </option>

                    <option value="Easy">
                        Easy
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Hard">
                        Hard
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="save-btn">

                    SAVE QUESTION

                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeQuestionModal()">

                    CANCEL

                </button>

            </div>

        </form>

    </div>

</div>


<script>

    /* =========================
       ADMIN LOGIN CHECK
    ========================== */

    if (
        localStorage.getItem("adminLoggedIn")
        !== "true"
    ) {

        window.location.href =
            "admin-login.html";

    }


    /* =========================
       DATA
    ========================== */

    let quizzes =
        JSON.parse(
            localStorage.getItem("quizzes") || "[]"
        );


    let questions =
        JSON.parse(
            localStorage.getItem("questions") || "[]"
        );


    /* =========================
       LOAD QUIZZES
    ========================== */

    function loadQuizOptions() {

        const quizSelect =
            document.getElementById("quizSelect");

        const formQuiz =
            document.getElementById("formQuiz");


        quizSelect.innerHTML = `
            <option value="">
                Select Quiz
            </option>
        `;


        formQuiz.innerHTML = `
            <option value="">
                Select Quiz
            </option>
        `;


        quizzes.forEach(function(quiz, index) {

            const option =
                document.createElement("option");

            option.value = quiz.name;

            option.textContent =
                quiz.name;

            quizSelect.appendChild(option);


            const formOption =
                document.createElement("option");

            formOption.value = quiz.name;

            formOption.textContent =
                quiz.name;

            formQuiz.appendChild(formOption);

        });

    }


    /* =========================
       LOAD QUESTIONS
    ========================== */

    function loadQuestions() {

        const selectedQuiz =
            document.getElementById("quizSelect")
                .value;


        let filtered = questions;


        if (selectedQuiz) {

            filtered =
                questions.filter(function(question) {

                    return question.quizName
                        === selectedQuiz;

                });

        }


        displayQuestions(filtered);

    }


    /* =========================
       DISPLAY QUESTIONS
    ========================== */

    function displayQuestions(list) {

        const table =
            document.getElementById(
                "questionTable"
            );


        table.innerHTML = "";


        let easy = 0;
        let medium = 0;
        let hard = 0;


        list.forEach(function(question) {

            if (question.difficulty === "Easy") {
                easy++;
            }

            if (question.difficulty === "Medium") {
                medium++;
            }

            if (question.difficulty === "Hard") {
                hard++;
            }

        });


        document.getElementById(
            "totalCount"
        ).textContent = list.length;


        document.getElementById(
            "easyCount"
        ).textContent = easy;


        document.getElementById(
            "mediumCount"
        ).textContent = medium;


        document.getElementById(
            "hardCount"
        ).textContent = hard;


        if (list.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="empty">

                        No questions found.

                    </td>

                </tr>

            `;

            return;

        }


        list.forEach(function(question) {

            const actualIndex =
                questions.indexOf(question);


            let difficultyClass =
                question.difficulty
                    .toLowerCase();


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${actualIndex + 1}
                </td>

                <td>
                    ${question.question}
                </td>

                <td>
                    ${question.options.A}
                </td>

                <td>
                    ${question.options.B}
                </td>

                <td>
                    ${question.options.C}
                </td>

                <td>
                    ${question.options.D}
                </td>

                <td>
                    ${question.correctAnswer}
                </td>

                <td class="${difficultyClass}">
                    ${question.difficulty}
                </td>

                <td>

                    <button
                        class="action-btn edit-btn"
                        onclick="editQuestion(${actualIndex})">

                        EDIT

                    </button>

                    <button
                        class="action-btn delete-btn"
                        onclick="deleteQuestion(${actualIndex})">

                        DELETE

                    </button>

                </td>

            `;


            table.appendChild(row);

        });

    }


    /* =========================
       OPEN QUESTION MODAL
    ========================== */

    function openQuestionModal() {

        if (quizzes.length === 0) {

            alert(
                "First create a quiz from Quiz Management."
            );

            return;

        }


        document.getElementById(
            "questionForm"
        ).reset();


        document.getElementById(
            "editIndex"
        ).value = "-1";


        document.getElementById(
            "modalHeading"
        ).textContent =
            "ADD QUESTION";


        document.getElementById(
            "questionModal"
        ).style.display =
            "flex";

    }


    /* =========================
       CLOSE MODAL
    ========================== */

    function closeQuestionModal() {

        document.getElementById(
            "questionModal"
        ).style.display =
            "none";

    }


    /* =========================
       SAVE QUESTION
    ========================== */

    document.getElementById(
        "questionForm"
    ).addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const quizName =
                document.getElementById(
                    "formQuiz"
                ).value;


            const question =
                document.getElementById(
                    "questionText"
                ).value.trim();


            const optionA =
                document.getElementById(
                    "optionA"
                ).value.trim();


            const optionB =
                document.getElementById(
                    "optionB"
                ).value.trim();


            const optionC =
                document.getElementById(
                    "optionC"
                ).value.trim();


            const optionD =
                document.getElementById(
                    "optionD"
                ).value.trim();


            const correctAnswer =
                document.getElementById(
                    "correctAnswer"
                ).value;


            const difficulty =
                document.getElementById(
                    "difficulty"
                ).value;


            const editIndex =
                Number(
                    document.getElementById(
                        "editIndex"
                    ).value
                );


            const questionData = {

                quizName: quizName,

                question: question,

                options: {

                    A: optionA,

                    B: optionB,

                    C: optionC,

                    D: optionD

                },

                correctAnswer:
                    correctAnswer,

                difficulty:
                    difficulty,

                createdAt:
                    new Date().toISOString()

            };


            /* EDIT */

            if (editIndex >= 0) {

                questions[editIndex] =
                    questionData;

                alert(
                    "Question updated successfully!"
                );

            }

            /* ADD */

            else {

                questions.push(
                    questionData
                );

                alert(
                    "Question added successfully!"
                );

            }


            localStorage.setItem(
                "questions",
                JSON.stringify(questions)
            );


            closeQuestionModal();

            loadQuestions();

        }
    );


    /* =========================
       EDIT QUESTION
    ========================== */

    function editQuestion(index) {

        const question =
            questions[index];


        document.getElementById(
            "editIndex"
        ).value = index;


        document.getElementById(
            "formQuiz"
        ).value =
            question.quizName;


        document.getElementById(
            "questionText"
        ).value =
            question.question;


        document.getElementById(
            "optionA"
        ).value =
            question.options.A;


        document.getElementById(
            "optionB"
        ).value =
            question.options.B;


        document.getElementById(
            "optionC"
        ).value =
            question.options.C;


        document.getElementById(
            "optionD"
        ).value =
            question.options.D;


        document.getElementById(
            "correctAnswer"
        ).value =
            question.correctAnswer;


        document.getElementById(
            "difficulty"
        ).value =
            question.difficulty;


        document.getElementById(
            "modalHeading"
        ).textContent =
            "EDIT QUESTION";


        document.getElementById(
            "questionModal"
        ).style.display =
            "flex";

    }


    /* =========================
       DELETE QUESTION
    ========================== */

    function deleteQuestion(index) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this question?"
            );


        if (!confirmDelete) {
            return;
        }


        questions.splice(index, 1);


        localStorage.setItem(
            "questions",
            JSON.stringify(questions)
        );


        loadQuestions();

    }


    /* =========================
       LOGOUT
    ========================== */

    function logout() {

        localStorage.removeItem(
            "adminLoggedIn"
        );


        window.location.href =
            "admin-login.html";

    }


    /* =========================
       INITIALIZE
    ========================== */

    loadQuizOptions();

    loadQuestions();


    /* =========================
       CLOSE MODAL OUTSIDE
    ========================== */

    window.onclick =
        function(event) {

            const modal =
                document.getElementById(
                    "questionModal"
                );


            if (event.target === modal) {

                closeQuestionModal();

            }

        };

</script>
